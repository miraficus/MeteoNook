name: Build Project

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [16.x] # Use Node.js 16.x to ensure compatibility with OpenSSL
        rust-version: [1.64.0] # Use Rust 1.64.0 for wasm-bindgen v0.2.67 compatibility

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      # Set OpenSSL Legacy Provider for Node.js
      - name: Set OpenSSL Legacy Provider
        run: echo "NODE_OPTIONS=--openssl-legacy-provider" >> $GITHUB_ENV

      # Install dependencies for frontend
      - name: Install dependencies (Frontend)
        run: npm install

      # Build the frontend
      - name: Build frontend
        run: npm run build

      # Set up Rust
      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ matrix.rust-version }}
          override: true

      # Install Rust dependencies
      - name: Install dependencies (Rust)
        run: cargo fetch

      # Build the Rust project
      - name: Build backend
        run: cargo build --release

      # Run tests
      - name: Run tests
        run: |
          npm test
          cargo test
