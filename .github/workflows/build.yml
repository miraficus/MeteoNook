name: Build Project

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [16.x] # Use older Node.js for OpenSSL compatibility
        rust-version: [1.39.0] # Use Rust 1.39.0 for compatibility with wasm-bindgen v0.2.67

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      # Set OpenSSL Legacy Provider
      - name: Set OpenSSL Legacy Provider
        run: echo "NODE_OPTIONS=--openssl-legacy-provider" >> $GITHUB_ENV

      # Install dependencies for frontend
      - name: Install dependencies (Frontend)
        run: npm install

      # Build the frontend
      - name: Build frontend
        run: npm run build

      # Set up Rust
      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ matrix.rust-version }}
          target: wasm32-unknown-unknown
          override: true

      # Install wasm-pack
      - name: Install wasm-pack
        run: cargo install wasm-pack

      # Build WebAssembly Package
      - name: Build WebAssembly Package
        run: wasm-pack build --target bundler

      # Install Rust dependencies
      - name: Install dependencies (Rust)
        run: cargo fetch

      # Build the Rust project
      - name: Build backend
        run: cargo build --release

      # Run tests
      - name: Run tests
        run: |
          npm test
          cargo test
