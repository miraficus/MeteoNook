name: Build Project

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [16.x]
        rust-version: [1.60.0]

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      # Verify Node.js Version
      - name: Check Node.js Version
        run: |
          if [[ "$(node -v)" != v16.* ]]; then
            echo "Error: Incorrect Node.js version. Required: 16.x"
            exit 1
          else
            echo "Node.js version is correct: $(node -v)"
          fi

      # Set up Rust
      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ matrix.rust-version }}
          target: wasm32-unknown-unknown
          override: true

      # Verify Rust Version
      - name: Check Rust Version
        run: |
          if [[ "$(rustc --version)" != *"1.60.0"* ]]; then
            echo "Error: Incorrect Rust version. Required: 1.60.0"
            exit 1
          else
            echo "Rust version is correct: $(rustc --version)"
          fi

      # Install dependencies for frontend
      - name: Install dependencies (Frontend)
        run: npm install

      # Install wasm-pack
      - name: Install wasm-pack
        run: cargo install wasm-pack

      # Build WebAssembly Package
      - name: Build WebAssembly Package
        run: wasm-pack build --target bundler

      # Install Rust dependencies
      - name: Install dependencies (Rust)
        run: cargo fetch

        # Build the frontend
      - name: Build frontend
        run: npm run build

      # Build the Rust project
      - name: Build backend
        run: cargo build --release

      # Run tests
      - name: Run tests
        run: |
          npm test
          cargo test
